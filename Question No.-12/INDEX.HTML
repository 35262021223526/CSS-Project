<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- THEME TOGGLE BUTTON -->
    <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1 class="fade-in">Welcome to My Animated Page</h1>
        <p class="fade-in delay">Smooth animations. Clean UI. Theme switching.</p>
        <a href="#" class="btn fade-in delay2">Get Started</a>
    </section>

    <script>
        // THEME SWITCHER
        const toggleBtn = document.getElementById("themeToggle");

        toggleBtn.addEventListener("click", () => {
            document.body.classList.toggle("dark");

            if (document.body.classList.contains("dark")) {
                toggleBtn.textContent = "☀️ Light Mode";
            } else {
                toggleBtn.textContent = "🌙 Dark Mode";
            }
        });
    </script>

</body>
</html>
