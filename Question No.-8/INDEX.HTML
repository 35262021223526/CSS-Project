<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta-size="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Notes Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sticky Header -->
    <header class="sticky-header">
        <h1>Sticky Notes Board</h1>
    </header>

    <!-- Sticky Notes Container -->
    <div class="board">

        <div class="note note1">
            <h3>Math Homework</h3>
            <p>Finish algebra exercises.</p>
        </div>

        <div class="note note2">
            <h3>Science Project</h3>
            <p>Make volcano model.</p>
        </div>

        <div class="note note3">
            <h3>Buy Supplies</h3>
            <p>Pen, Notebook, Sketchbook</p>
        </div>

        <div class="note note4">
            <h3>Reminder</h3>
            <p>Test on Monday!</p>
        </div>

    </div>

</body>
</html>
