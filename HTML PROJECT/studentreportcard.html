<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report Card</title>
</head>

<body style="font-family: Arial; background-color: #f4f4f4;">

    <!-- Header Section -->
    <div style="text-align:center; padding:20px; background-color:#4CAF50; color:white;">
        <img src="school-logo.png" alt="School Logo" width="80">
        <h1>ABC Public School</h1>
        <p>Student Report Card</p>
    </div>

    <!-- Student Information -->
    <div style="margin:20px;">
        <h2>Student Information</h2>
        <p><strong>Name:</strong> Vinayam Shaurya</p>
        <p><strong>Roll No:</strong> 101</p>
        <p><strong>Class:</strong> 10th Grade</p>
    </div>

    <!-- Marks Table -->
    <div style="margin:20px;">
        <h2>Academic Performance</h2>

        <table border="1" width="100%" cellpadding="10" cellspacing="0">
            <thead style="background-color:#ddd;">
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                    <th>Grade</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Mathematics</td>
                    <td>95</td>
                    <td>A+</td>
                </tr>
                <tr>
                    <td>Science</td>
                    <td>88</td>
                    <td>A</td>
                </tr>
                <tr>
                    <td>English</td>
                    <td>85</td>
                    <td>A</td>
                </tr>
                <tr>
                    <td>Social Studies</td>
                    <td>90</td>
                    <td>A+</td>
                </tr>
                <tr>
                    <td>Computer</td>
                    <td>92</td>
                    <td>A+</td>
                </tr>
            </tbody>

            <tfoot style="background-color:#eee;">
                <tr>
                    <th>Total</th>
                    <th>450 / 500</th>
                    <th>A+</th>
                </tr>
            </tfoot>
        </table>
    </div>

    <!-- Download Button -->
    <div style="text-align:center; margin:30px;">
        <a href="report-card.pdf" download style="padding:10px 20px; background-color:#4CAF50; color:white; text-decoration:none; border-radius:5px;">
            Download Report Card
        </a>
    </div>

</body>
</html>
