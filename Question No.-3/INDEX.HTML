<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card + Navbar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">MyProfile</div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Skills</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Profile Card -->
    <div class="profile-card">

        <!-- Your photo -->
        <img src="Vinayam Shaurya.jpg" alt="Profile Photo">

        <h2>Vinayam Shaurya</h2>
        <p class="role">Frontend Developer</p>
        <p class="bio">
            Passionate about creating clean UI designs, animations, and responsive web layouts.
        </p>

        <div class="btn-group">
            <button class="btn primary">Follow</button>
            <button class="btn secondary">Message</button>
        </div>
    </div>

</body>
</html>
