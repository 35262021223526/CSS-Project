<!DOCTYPE html>
<html>
<head>
<style>
.card {
  width:200px;
  height:250px;
  perspective:1000px;
}
.inner {
  width:100%;
  height:100%;
  transition:0.6s;
  transform-style:preserve-3d;
}
.card:hover .inner {
  transform:rotateY(180deg);
}
.front, .back {
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
}
.back {
  transform:rotateY(180deg);
  background:lightblue;
}
</style>
</head>
<body>

<div class="card">
  <div class="inner">
    <div class="front">Product</div>
    <div class="back">₹999</div>
  </div>
</div>

</body>
</html>
