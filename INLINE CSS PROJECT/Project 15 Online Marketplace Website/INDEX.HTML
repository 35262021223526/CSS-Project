<!DOCTYPE html>
<html>
<head>
<style>
nav {
  display:flex;
  justify-content:space-between;
  background:black;
  color:white;
  padding:10px;
}
.products {
  display:grid;
  grid-template-columns:repeat(4,1fr);
}
.card {
  padding:10px;
  border:1px solid #ccc;
}
</style>
</head>
<body>

<nav>
  <div>Shop</div>
  <div>Cart</div>
</nav>

<div class="products">
  <div class="card">Product 1</div>
  <div class="card">Product 2</div>
</div>

</body>
</html>
