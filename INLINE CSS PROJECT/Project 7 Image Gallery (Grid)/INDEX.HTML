<!DOCTYPE html>
<html>
<head>
<style>
.gallery {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
img {
  width:100%;
  transition:0.3s;
}
img:hover {
  transform:scale(1.1);
}
</style>
</head>
<body>

<div class="gallery">
  <img src="https://via.placeholder.com/200">
  <img src="https://via.placeholder.com/200">
  <img src="https://via.placeholder.com/200">
</div>

</body>
</html>
