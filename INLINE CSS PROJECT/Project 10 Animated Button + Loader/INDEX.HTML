<!DOCTYPE html>
<html>
<head>
<style>
button {
  padding:10px 20px;
  transition:0.3s;
}
button:hover {
  transform:scale(1.1);
}

.loader {
  width:40px;
  height:40px;
  border:5px solid lightgray;
  border-top:5px solid blue;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin {
  100% { transform:rotate(360deg); }
}
</style>
</head>
<body>

<button>Hover</button>
<div class="loader"></div>

</body>
</html>
