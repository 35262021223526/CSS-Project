<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Profile Card</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">MyProfile</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Projects</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!-- Profile Card -->
  <section class="card">
    <img src="Vinayam Shaurya.jpg" alt="Profile Photo" class="profile-img" />
    <h2>VINAYAM SHAURYA</h2>
    <p>Full Stack Developer | Designer | Tech Enthusiast</p>

    <div class="buttons">
      <button class="btn primary"><i class="fab fa-linkedin"></i> Connect</button>
      <button class="btn secondary"><i class="fab fa-github"></i> Projects</button>
    </div>
  </section>
</body>
</html>
