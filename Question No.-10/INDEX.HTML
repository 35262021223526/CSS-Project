<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Buttons & Loader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="title">Animated Buttons + CSS Loader</h1>

    <!-- BUTTON SECTION -->
    <div class="button-container">

        <button class="btn btn1">Hover Me</button>
        <button class="btn btn2">Glow Button</button>
        <button class="btn btn3">Pop Effect</button>

    </div>

    <!-- LOADER SECTION -->
    <div class="loader-section">
        <h2>CSS Only Loader</h2>
        <div class="loader"></div>
    </div>

</body>
</html>
