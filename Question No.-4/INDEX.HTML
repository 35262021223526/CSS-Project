<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CSS Flags — India & France</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <figure class="flag-wrap">
      <div class="flag india" role="img" aria-label="Flag of India">
        <span class="chakra" aria-hidden="true"></span>
      </div>
      <figcaption>India — horizontal tricolour with Ashoka Chakra</figcaption>
    </figure>

    <figure class="flag-wrap">
      <div class="flag france" role="img" aria-label="Flag of France"></div>
      <figcaption>France — vertical tricolour (blue, white, red)</figcaption>
    </figure>
  </main>
</body>
</html>
