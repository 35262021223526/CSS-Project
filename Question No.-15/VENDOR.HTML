<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">MarketPlace</div>
    <ul class="nav-icons">
        <li><a href="index.html">Home</a></li>
    </ul>
</nav>

<section class="vendor-header">
    <h1>Seller: TechWorld</h1>
    <p>Premium electronics delivered fast.</p>
</section>

<section class="products">
    <h2>Products by TechWorld</h2>

    <div class="product-grid">

        <div class="product-card">
            <img src="https://picsum.photos/300/200?random=21">
            <h4>Bluetooth Speaker</h4>
            <p class="price">$25.00</p>
        </div>

        <div class="product-card">
            <img src="https://picsum.photos/300/200?random=22">
            <h4>Keyboard</h4>
            <p class="price">$18.00</p>
        </div>

    </div>
</section>

</body>
</html>
